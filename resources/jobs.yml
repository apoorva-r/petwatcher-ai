resources:
  jobs:
    petwatch_sample_data:
      name: "[${bundle.target}] PetWatch - Generate Sample Data"

      tasks:
        - task_key: generate_sample_data

          spark_python_task:
            python_file: ../src/data/generate_pet_data.py

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "faker==37.6.0"